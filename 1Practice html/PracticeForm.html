<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>

        <label for="name">Enter the name</label> 
        <input id="name" value="Male" placeholder="full name" name="Entered-name" type="text">

        <br>
        <br>

        <label for="email">Enter the Email</label>
        <input id="email" name="Entered-email" placeholder="@email.com" type="email" >

        <br>
        <br>

        <label for="password">Enter the Password</label>
        <input id="password" type="password" name="Entered-password" placeholder="**********" >

        <br>
        <br>

        <label for="Age">Enter Age</label>
        <input id="Age" type="number" name="Entered-age" min="1" max="5">

        <br>
        <br>

        <p>Choose the Gender</p>
        <label for="Male">Male</label>
        <input id="Male" type="radio" name="Gender">
        <label for="Female">Female</label>
        <input id="Female" type="radio" name="Gender">
        <label for="Other">Other</label>
        <input id="Other" type="radio" name="Gender">

        <br>
        <br>

        <p>Choose the Event</p>
        <label for="Web-Development">Web-Development</label>
        <input id="Web-Development" type="radio" name="Event">
        <label for="AI">AI</label>
        <input id="AI" type="radio" name="Event">
        <label for="Cybersecurity">Cybersecurity</label>
        <input id="Cybersecurity" type="radio" name="Event">

        <br>
        <br>

        <p>Choose the SkillSet</p>
        <label for="HTML">HTML</label>
        <input id="HTML" type="checkbox" name="SkillSet">
        <label for="CSS">CSS</label>
        <input id="CSS" type="checkbox" name="SkillSet">
        <label for="JavaScript">JavaScript</label>
        <input id="JavaScript" type="checkbox" name="SkillSet">

        <br>
        <br>

        <br>
        <br>

        <label for="Date">Select The Date</label>
        <input id="Date" type="date" name="Date" required>

        <br>
        <br>

        <label for="Description"> Short Description</label>
        <textarea id="Description" name="Description" rows="5" cols="30"></textarea>

        <br>
        <br>

        <p>Terms and Condititon</p>
        <label for="Yes">Yes</label>
        <input id="Yes" type="radio" name="Terms" >
        <label for="No">No</label>
        <input id="No" type="radio" name="Terms" >

        <br>
        <br>
        <input type="submit" name="Submission" id="Submission">
        <input type="reset" name="Reset" id="Reset">
    </form>


</body>
</html>
